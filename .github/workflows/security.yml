name: Security

on:
  pull_request:
    branches: [main]
  # Daily, so newly published RustSec advisories surface without waiting for a PR.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # advisories: RustSec vulnerabilities, unmaintained, unsound, yanked
        # licenses:   permissive-only allowlist (deny.toml)
        # bans:       wildcard version requirements
        # sources:    crates.io only, no git/alternate registries
        check: [advisories, licenses, bans, sources]
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.check }}
