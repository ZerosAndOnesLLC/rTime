# cargo-deny configuration — run with `cargo deny check`.
# CI runs this on every PR and daily (see .github/workflows/security.yml).

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability, unmaintained, unsound, or yanked crate.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only; anything else fails the check.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps carry version pins, so they are not wildcards.
allow-wildcard-paths = true

[sources]
# Only crates.io; no git or alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
