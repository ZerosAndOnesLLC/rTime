[workspace]
members = [
    "crates/rtime-core",
    "crates/rtime-ntp",
    "crates/rtime-nts",
    "crates/rtime-ptp",
    "crates/rtime-clock",
    "crates/rtime-net",
    "crates/rtime-refclock",
    "crates/rtime-metrics",
    ".",
]
resolver = "2"

[workspace.package]
version = "0.14.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Zeros And Ones LLC"]
repository = "https://github.com/ZerosAndOnesLLC/rTime"
homepage = "https://github.com/ZerosAndOnesLLC/rTime"

[workspace.dependencies]
# Constant-time comparison
subtle = "2"

# Internal crates (version pins are required so path deps resolve on crates.io)
rtime-core = { path = "crates/rtime-core", version = "0.14.1" }
rtime-ntp = { path = "crates/rtime-ntp", version = "0.14.1" }
rtime-nts = { path = "crates/rtime-nts", version = "0.14.1" }
rtime-ptp = { path = "crates/rtime-ptp", version = "0.14.1" }
rtime-clock = { path = "crates/rtime-clock", version = "0.14.1" }
rtime-net = { path = "crates/rtime-net", version = "0.14.1" }
rtime-refclock = { path = "crates/rtime-refclock", version = "0.14.1" }
rtime-metrics = { path = "crates/rtime-metrics", version = "0.14.1" }

# Async
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros"] }

# Serialization / Config
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# System
libc = "0.2"
nix = { version = "0.31", features = ["time", "net", "ioctl", "fs", "process"] }

# Crypto / TLS
rustls = "0.23"
aes-siv = "0.8"
rand = "0.10"
sha2 = "0.11"

# HTTP / Metrics
axum = "0.8"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

[package]
name = "rtimed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-performance NTP/PTP time synchronization daemon (NTPv4, NTS, PTP). Installs as the `rtime` binary."
documentation = "https://docs.rs/rtimed"
readme = "README.md"
keywords = ["ntp", "ptp", "nts", "ntpd", "time"]
categories = ["command-line-utilities", "network-programming", "date-and-time"]

[[bin]]
name = "rtime"
path = "src/main.rs"

[dependencies]
rtime-core = { workspace = true }
rtime-ntp = { workspace = true }
rtime-nts = { workspace = true }
rtime-ptp = { workspace = true }
rtime-net = { workspace = true }
rtime-clock = { workspace = true }
rtime-metrics = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
axum = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[features]
default = ["ntp", "ptp", "nts", "clock-discipline", "metrics"]
ntp = []
ptp = []
nts = []
clock-discipline = []
metrics = []
gps = []
pps = []
hardware-timestamping = []
